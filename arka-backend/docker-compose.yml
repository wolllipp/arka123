services:
  postgres:
    image: postgres:16
    container_name: arka-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"   # 5432–5434 заняты другими проектами
    volumes:
      - arka_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: arka-redis
    ports:
      - "6380:6379"   # 6379 — coworks

volumes:
  arka_pg_data:

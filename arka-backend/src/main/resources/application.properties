spring.application.name=arka-backend
server.port=${PORT:8090}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5435}/${POSTGRES_DB:arka}
spring.datasource.username=${POSTGRES_USER:arka}
spring.datasource.password=${POSTGRES_PASSWORD:arka}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.cache.type=redis

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=10800000

# первый администратор создаётся при старте, если его ещё нет
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# сайт-макет запускается на 8123; на хостинге — адрес сайта через CORS_ORIGINS
app.cors.allowed-origins=${CORS_ORIGINS:http://127.0.0.1:8123,http://localhost:8123}
# неподтверждённая бронь держит слот не дольше суток
app.booking.pending-ttl-hours=24
app.booking.free-cancel-hours=24
spring.cache.redis.time-to-live=10m

# почта: по умолчанию — локальный Mailpit из docker-compose; для настоящей отправки — SMTP Gmail/Яндекса
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:АРКА 123 <noreply@arka123.by>}
# куда слать уведомления о новых бронях (пусто — не слать)
app.mail.admin-to=${ADMIN_NOTIFY_EMAIL:}
# адрес сайта — для ссылок в письмах
app.site-url=${SITE_URL:http://127.0.0.1:8123}
# напоминание — за сутки до начала
app.booking.reminder-hours=24
